name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: quick_validate.py on every skill
        run: bash tests/test-skill-frontmatter.sh

      - name: Shell tests (tests/*.sh)
        run: |
          command -v jq
          status=0
          for t in tests/*.sh; do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Validation contract (node --test)
        run: node --test skills/validation/scripts/validation-contract.test.js

      - name: git diff --check on the changed range
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "checking $range"
          git diff --check "$range"
